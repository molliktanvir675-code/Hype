<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYPE 1080p60 Encoder</title>
<style>
body{margin:0;background:#09090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:700px;margin:auto;padding:25px 16px}.card{background:#15151b;border:1px solid #292933;border-radius:18px;padding:18px;margin:14px 0}
h1{margin:0 0 6px}.muted{color:#999}.tag{display:inline-block;background:#24242c;border-radius:20px;padding:6px 9px;font-size:12px;margin:3px}
input,button{width:100%;box-sizing:border-box;border-radius:12px;padding:14px;margin-top:12px}
input{background:#0d0d12;color:#ccc;border:1px dashed #444}
button{border:0;background:#fff;color:#000;font-weight:700;font-size:16px}button:disabled{opacity:.45}
.track{height:9px;background:#292933;border-radius:20px;margin-top:15px;overflow:hidden}.fill{height:100%;width:0;background:#fff}
#status{color:#aaa;font-size:14px;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<main>
<h1>HYPE 1080p60 Encoder</h1>
<div class="muted">Browser-side H.264 / 60 FPS encoder</div>

<div class="card">
<span class="tag">1080×1920</span>
<span class="tag">60 FPS CFR</span>
<span class="tag">H.264 High</span>
<span class="tag">CRF 18</span>
</div>

<div class="card">
<input id="file" type="file" accept="video/*">
<button id="go">Encode Video</button>
<div class="track"><div id="fill" class="fill"></div></div>
<div id="status">Select a video first.</div>
<button id="download" style="display:none">Download 1080p60 MP4</button>
</div>

<div class="card muted" style="font-size:12px;line-height:1.5">
FFmpeg core is loaded from jsDelivr. The WASM file is loaded from this website's folder.
Keep <b>ffmpeg-core.wasm</b> beside <b>index.html</b> on GitHub Pages.
</div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const ffmpeg = new FFmpeg();
const fileEl = document.getElementById("file");
const go = document.getElementById("go");
const dl = document.getElementById("download");
const status = document.getElementById("status");
const fill = document.getElementById("fill");
let url = null;

ffmpeg.on("progress", ({progress}) => {
  const p = Math.max(0, Math.min(1, progress || 0));
  fill.style.width = (p * 100) + "%";
  status.textContent = "Encoding… " + Math.round(p * 100) + "%";
});

async function loadFFmpeg(){
  if(ffmpeg.loaded) return;
  status.textContent = "Loading FFmpeg…";
  await ffmpeg.load({
    coreURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.js",
    wasmURL: location.href.replace(/[^/]*$/, "") + "ffmpeg-core.wasm"
  });
}

go.onclick = async () => {
  const file = fileEl.files?.[0];
  if(!file){ status.textContent="Select a video first."; return; }

  go.disabled=true; dl.style.display="none"; fill.style.width="0%";

  try{
    await loadFFmpeg();

    const inputName = "input." + ((file.name.split(".").pop() || "mp4").toLowerCase());
    const outputName = "HYPE_1080p60.mp4";

    status.textContent="Reading video…";
    await ffmpeg.writeFile(inputName, await fetchFile(file));

    status.textContent="Starting encode…";
    await ffmpeg.exec([
      "-i", inputName,
      "-vf", "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2",
      "-r","60",
      "-fps_mode","cfr",
      "-c:v","libx264",
      "-preset","medium",
      "-crf","18",
      "-profile:v","high",
      "-level","4.2",
      "-pix_fmt","yuv420p",
      "-c:a","aac",
      "-b:a","192k",
      "-movflags","+faststart",
      outputName
    ]);

    const data = await ffmpeg.readFile(outputName);
    if(url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(new Blob([data.buffer],{type:"video/mp4"}));

    fill.style.width="100%";
    status.textContent="Done! Tap Download.";
    dl.style.display="block";

    try{await ffmpeg.deleteFile(inputName)}catch(e){}
    try{await ffmpeg.deleteFile(outputName)}catch(e){}
  }catch(e){
    console.error(e);
    status.textContent="Error: " + (e?.message || e);
  }finally{
    go.disabled=false;
  }
};

dl.onclick=()=>{
  if(!url)return;
  const a=document.createElement("a");
  a.href=url;a.download="HYPE_1080p60.mp4";
  document.body.appendChild(a);a.click();a.remove();
};
</script>
</main>
</body>
</html>
